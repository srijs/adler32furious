[package]
name = "adler32furious-bench"
version = "0.0.0"
description = "Benchmarks of adler32furious against other Adler-32 implementations"
edition = "2024"
publish = false

[dependencies]
adler32furious = { path = ".." }

[dev-dependencies]
adler2 = "2"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
libdeflater = "1.26"
simd-adler32 = "0.3"

[[bench]]
name = "adler32"
harness = false

[lints]
workspace = true
