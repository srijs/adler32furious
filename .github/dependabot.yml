version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  # The library, its dev-dependencies and the bench crate. Dev-dependencies
  # are not held to the MSRV: the msrv job strips them before building.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns:
          - "*"

  # The fuzz crate is a separate, unpublished package with its own manifest.
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns:
          - "*"
